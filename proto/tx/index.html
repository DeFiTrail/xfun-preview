<!doctype html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>链上详情 · X.FUN</title>
<script>try{var l=localStorage.getItem('xfun.lang')||'zh';var d=document.documentElement;
d.dataset.lang=l;d.lang=({zh:'zh-CN',ft:'zh-TW',en:'en',ja:'ja',ko:'ko',vi:'vi',th:'th',id:'id'})[l]||'zh-CN';
if(l!=='zh')d.className='i18n-wait';}catch(e){}</script>
<style>html.i18n-wait body{visibility:hidden}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap">
<link rel="stylesheet" href="../app.css">
</head>
<body data-page="home">
<!-- ============================ 链上详情 ============================
     单笔交易的站内详情页。无导航入口，从首页「金库套利记录」弹窗里点一笔交易进来。
     网址：tx/?a=<金库地址>&h=<交易哈希>
     取数与渲染在 protosrc/sm-tx.js。找这笔交易的顺序：
       ① 浏览器缓存 → ② 随站点发布的快照 → ③ 按地址去接口取
     做法对应 FLC 的 TxDetailView：链路在站内闭环，不外跳区块浏览器。
     字段名固定用英文、数值按记录原样显示，不走多语言。
     一笔交易由几条成交合成时：Size / Notional / Closed PnL / Fee 是合计，Price 一项改标 Avg Price。
================================================================= -->
<section class="wrap txp-wrap page-head">
  <a class="btn btn-quiet btn-sm" href="../" data-tx-back>← <t-x data-i="k5f41122">返回</t-x></a>
  <h1 class="h1" style="margin-top:18px;font-size:clamp(24px,2.8vw,34px)"><t-x data-i="k374574f">链上详情</t-x></h1>
  <p class="scope mono" style="margin-top:2px" data-tx-addr></p>
</section>

<section class="section" style="padding-top:0" data-txp>
  <div class="wrap txp-wrap">
    <div class="txp">
      <div class="card txp-msg" data-tx-state="loading"><t-x data-i="k655e5b6">正在读取链上数据…</t-x></div>
      <div class="card txp-msg" data-tx-state="none" hidden><t-x data-i="k4457560">未找到这笔成交记录</t-x></div>

      <div data-tx-state="ok" hidden>
        <div class="explorer">
          <div class="exp-top">
            <span class="exp-t">TRANSACTION DETAILS</span>
            <span class="exp-tag exp-tag--live" data-tx-tag="live">✓ Filled</span>
          </div>
          <div class="exp-action" data-tx-action>
            <div class="exp-k">TRADE ACTION</div>
            <div class="exp-line"><span class="exp-dir" data-tx-a="dir"></span> <b data-tx-a="sz"></b> <span data-tx-a="coin"></span> @ <b data-tx-a="px"></b></div>
          </div>
          <div class="erows">
            <div class="erow"><span class="erow__k">Tx Hash</span><span class="erow__v" data-tx-f="hash"></span></div>
            <div class="erow"><span class="erow__k">Asset</span><span class="erow__v" data-tx-f="coin"></span></div>
            <div class="erow"><span class="erow__k">Direction</span><span class="erow__v" data-tx-f="dir"></span></div>
            <div class="erow"><span class="erow__k">Size</span><span class="erow__v" data-tx-f="sz"></span></div>
            <div class="erow"><span class="erow__k" data-tx-k="px">Price</span><span class="erow__v" data-tx-f="px"></span></div>
            <div class="erow"><span class="erow__k">Notional</span><span class="erow__v" data-tx-f="notional"></span></div>
            <div class="erow"><span class="erow__k">Closed PnL</span><span class="erow__v" data-tx-f="pnl"></span></div>
            <div class="erow"><span class="erow__k">Fee</span><span class="erow__v" data-tx-f="fee"></span></div>
            <div class="erow"><span class="erow__k">Order ID</span><span class="erow__v" data-tx-f="oid"></span></div>
            <div class="erow"><span class="erow__k">Timestamp</span><span class="erow__v" data-tx-f="time"></span></div>
            <div class="erow"><span class="erow__k">Trade ID</span><span class="erow__v" data-tx-f="tid"></span></div>
          </div>
        </div>
        <p class="txp-note" data-tx-note><t-x data-i="kbe20f94">以上字段直接取自链上成交记录：方向、数量、价格与结算结果均按原样呈现，平台不做修改。</t-x></p>
        <div class="txp-acts">
          <button class="btn btn-ghost" data-tx-copy data-copy=""><t-x data-i="k95db0ee">复制交易哈希</t-x></button>
          <a class="btn btn-ghost" href="../" data-tx-back><t-x data-i="kac263c5">金库套利记录</t-x></a>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="../app.js"></script>
</body>
</html>
